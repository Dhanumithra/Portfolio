<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pinkCaseBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5c9e"/>
      <stop offset="100%" stop-color="#c9185b"/>
    </linearGradient>
    <linearGradient id="pinkCaseFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff75ac"/>
      <stop offset="100%" stop-color="#db2066"/>
    </linearGradient>
    <filter id="caseShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#a81347" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Handle -->
  <path d="M 34 26 V 17 C 34 11, 66 11, 66 17 V 26" fill="none" stroke="#9e1043" stroke-width="7" stroke-linecap="round"/>

  <!-- Briefcase Main Body -->
  <rect x="8" y="24" width="84" height="60" rx="14" fill="url(#pinkCaseBody)" filter="url(#caseShadow)"/>

  <!-- Subtle Side Straps -->
  <rect x="24" y="24" width="7" height="60" fill="#9e1043" opacity="0.32"/>
  <rect x="69" y="24" width="7" height="60" fill="#9e1043" opacity="0.32"/>

  <!-- Top Flap Contour with Center Dip -->
  <path d="M 8 24 H 92 V 46 C 92 51, 87 55, 82 55 L 56 58 C 52 58.5, 48 58.5, 44 58 L 18 55 C 13 55, 8 51, 8 46 Z" fill="url(#pinkCaseFlap)"/>

  <!-- Strap Buckles / Hardware -->
  <rect x="23" y="47" width="9" height="7" rx="2" fill="#ffe4ec" stroke="#9e1043" stroke-width="1.5"/>
  <rect x="68" y="47" width="9" height="7" rx="2" fill="#ffe4ec" stroke="#9e1043" stroke-width="1.5"/>

  <!-- Center Metallic Clasp / Lock -->
  <rect x="43" y="48" width="14" height="17" rx="3.5" fill="#ffffff" stroke="#ffccd9" stroke-width="1"/>
  <rect x="48" y="55" width="4" height="5" rx="1" fill="#c9185b"/>

  <!-- Protective Bottom Studs -->
  <circle cx="22" cy="85" r="2.5" fill="#9e1043"/>
  <circle cx="78" cy="85" r="2.5" fill="#9e1043"/>
</svg>
